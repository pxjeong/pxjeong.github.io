<!doctype html>
<html lang="{{ site.lang | default: 'ko' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#110c09">
    {% seo %}
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | absolute_url }}">
    <link rel="icon" href="{{ '/assets/img/px.svg' | relative_url }}" type="image/svg+xml">
    <link rel="preload" href="{{ '/assets/fonts/gmarket/GmarketSansTTFMedium.ttf' | relative_url }}" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/css/notebook.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 이동</a>
    <div class="site-shell">
      <header class="site-header">
        <a class="identity" href="{{ '/' | relative_url }}" aria-label="PX 블로그 홈">
          <span class="wordmark">px<span class="wordmark-dot">.</span></span>
          <span class="identity-caption">Parksejeong<br>개발 · 보안 학습 노트</span>
        </a>
        <nav aria-label="주 메뉴">
          <a href="{{ '/' | relative_url }}" {% if page.url == '/' or page.layout == 'post' %}aria-current="page"{% endif %}>기록</a>
          <a href="{{ '/categories/' | relative_url }}" {% if page.url contains '/categories/' or page.url contains '/topics/' %}aria-current="page"{% endif %}>주제</a>
          <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>소개</a>
        </nav>
      </header>
      <main id="main" tabindex="-1">{{ content }}</main>
      <footer class="site-footer">
        <p>© {{ site.time | date: '%Y' }} Parksejeong <span>·</span> PX 학습 노트</p>
        <div><a href="https://github.com/pxjeong">GitHub ↗</a><a href="{{ '/feed.xml' | relative_url }}">RSS ↗</a><a href="{{ '/archives/' | relative_url }}">아카이브 ↗</a></div>
      </footer>
    </div>
    <div class="dog-scrollbar" role="scrollbar" tabindex="0" aria-label="페이지 스크롤" aria-controls="main" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
      <span class="scroll-dog" aria-hidden="true"><span class="scroll-dog-body"></span><span class="scroll-dog-paws"></span><span class="scroll-dog-head"><span></span></span></span>
    </div>
    <script src="{{ '/assets/js/dog-scrollbar.js' | relative_url }}" defer></script>
  </body>
</html>
